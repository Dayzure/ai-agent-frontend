<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- MSAL Browser (CDN) -->
  <script src="https://alcdn.msauth.net/browser/3.13.0/js/msal-browser.min.js"></script>

  <style>
    :root {
      --header-height: 60px;
      --sidebar-width: 260px;
      --input-bar-height: 80px;
    }

    body {
      background: #f4f6fb;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────── */
    #app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      padding: 0 1.25rem;
      z-index: 1000;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    #app-header .brand {
      display: flex;
      align-items: center;
      gap: .55rem;
      font-size: 1.15rem;
      font-weight: 700;
      color: #2d3748;
      text-decoration: none;
    }

    #app-header .brand .icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1rem;
    }

    #auth-area {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: .75rem;
    }

    #user-info {
      display: none;
      align-items: center;
      gap: .5rem;
    }

    #user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: .8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #user-name {
      font-size: .9rem;
      color: #4a5568;
      font-weight: 500;
    }

    /* ── Layout ──────────────────────────────────────── */
    #main-layout {
      display: flex;
      height: 100vh;
      padding-top: var(--header-height);
    }

    /* ── Sidebar ─────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-width);
      background: #fff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid #e2e8f0;
    }

    #new-chat-btn {
      width: 100%;
    }

    #conversation-list {
      flex: 1;
      overflow-y: auto;
      padding: .5rem;
    }

    .convo-item {
      padding: .55rem .75rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: .875rem;
      color: #4a5568;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background .15s;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .convo-item:hover {
      background: #f0f4ff;
    }

    .convo-item.active {
      background: #ebf0ff;
      color: #4c51bf;
      font-weight: 500;
    }

    /* ── Chat Area ───────────────────────────────────── */
    #chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #message-list {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }

    /* message bubbles */
    .msg-row {
      display: flex;
      gap: .6rem;
      animation: fadeInUp .2s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .8rem;
      font-weight: 700;
      color: #fff;
    }

    .msg-row.assistant .msg-avatar {
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .msg-row.user .msg-avatar {
      background: linear-gradient(135deg, #38b2ac, #3182ce);
    }

    .msg-bubble {
      max-width: 72%;
      padding: .65rem 1rem;
      border-radius: 14px;
      font-size: .92rem;
      line-height: 1.55;
      word-break: break-word;
    }

    .msg-row.assistant .msg-bubble {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
      color: #2d3748;
    }

    .msg-row.user .msg-bubble {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    /* typing indicator */
    .typing-indicator span {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #a0aec0;
      margin: 0 2px;
      animation: blink 1.2s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: .2s; }
    .typing-indicator span:nth-child(3) { animation-delay: .4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: .2; }
      40%            { opacity: 1; }
    }

    /* empty state */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #a0aec0;
      text-align: center;
      padding: 2rem;
      pointer-events: none;
    }

    #empty-state .empty-icon {
      font-size: 3.5rem;
      margin-bottom: .75rem;
      opacity: .4;
    }

    /* ── Input Bar ───────────────────────────────────── */
    #input-bar {
      border-top: 1px solid #e2e8f0;
      background: #fff;
      padding: .75rem 1rem;
      display: flex;
      gap: .6rem;
      align-items: flex-end;
    }

    #chat-input {
      flex: 1;
      resize: none;
      border-radius: 12px;
      border: 1px solid #cbd5e0;
      padding: .55rem .85rem;
      font-size: .92rem;
      line-height: 1.5;
      max-height: 140px;
      overflow-y: auto;
      background: #f7fafc;
      transition: border-color .15s, box-shadow .15s;
    }

    #chat-input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,.15);
      outline: none;
      background: #fff;
    }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 768px) {
      #sidebar {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- ── Header ──────────────────────────────────────── -->
  <header id="app-header">
    <a href="#" class="brand">
      <span class="icon"><i class="bi bi-stars"></i></span>
      AI Agent
    </a>

    <div id="auth-area">
      <button id="login-btn" class="btn btn-primary btn-sm px-3">
        <i class="bi bi-person-fill me-1"></i>Login
      </button>

      <div id="user-info">
        <div id="user-avatar"></div>
        <span id="user-name"></span>
        <button id="logout-btn" class="btn btn-outline-secondary btn-sm px-3">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </button>
      </div>
    </div>
  </header>

  <!-- ── Main Layout ──────────────────────────────────── -->
  <div id="main-layout">

    <!-- Sidebar -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <button id="new-chat-btn" class="btn btn-outline-primary btn-sm">
          <i class="bi bi-plus-lg me-1"></i>New Chat
        </button>
      </div>
      <div id="conversation-list">
        <!-- conversations inserted here -->
      </div>
    </aside>

    <!-- Chat Area -->
    <section id="chat-area">
      <div id="message-list">
        <div id="empty-state">
          <div class="empty-icon"><i class="bi bi-chat-dots"></i></div>
          <p class="mb-0 fw-medium">Start a conversation</p>
          <p class="small">Type a message below to chat with the AI agent.</p>
        </div>
      </div>

      <!-- Input Bar -->
      <div id="input-bar">
        <textarea
          id="chat-input"
          rows="1"
          placeholder="Message AI Agent…"
          aria-label="Chat input"
        ></textarea>
        <button id="send-btn" class="btn btn-primary" title="Send">
          <i class="bi bi-send-fill"></i>
        </button>
        <button id="clear-btn" class="btn btn-outline-secondary" title="Clear chat">
          <i class="bi bi-trash3"></i>
        </button>
      </div>
    </section>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Inject server-side env vars into window.__ENV__ -->
  <script src="/env-config.js"></script>

  <!-- Auth module -->
  <script src="auth.js"></script>

  <script>
    // ── State ──────────────────────────────────────────
    let conversations = [];   // [{ id, title, messages: [] }]
    let activeConvoId = null;

    // ── DOM refs ───────────────────────────────────────
    const loginBtn        = document.getElementById('login-btn');
    const logoutBtn       = document.getElementById('logout-btn');
    const userInfo        = document.getElementById('user-info');
    const userAvatar      = document.getElementById('user-avatar');
    const userNameEl      = document.getElementById('user-name');
    const messageList     = document.getElementById('message-list');
    const emptyState      = document.getElementById('empty-state');
    const chatInput       = document.getElementById('chat-input');
    const sendBtn         = document.getElementById('send-btn');
    const clearBtn        = document.getElementById('clear-btn');
    const newChatBtn      = document.getElementById('new-chat-btn');
    const convoList       = document.getElementById('conversation-list');

    // ── Auth UI helpers ────────────────────────────────
    function showUserUI(account) {
      const name = account.name || account.username || 'User';
      const initials = name.split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();
      userAvatar.textContent = initials;
      userNameEl.textContent = name;
      userInfo.style.display = 'flex';
      loginBtn.style.display = 'none';
    }

    function showLoginUI() {
      userInfo.style.display = 'none';
      loginBtn.style.display = '';
    }

    // ── Auth events ────────────────────────────────────
    loginBtn.addEventListener('click', async () => {
      try {
        const result = await login();
        showUserUI(result.account);
      } catch (err) {
        console.error('Login failed:', err);
      }
    });

    logoutBtn.addEventListener('click', async () => {
      try {
        await logout();
        showLoginUI();
      } catch (err) {
        console.error('Logout failed:', err);
      }
    });

    // ── Conversation helpers ───────────────────────────
    function createConversation(title) {
      const id = Date.now().toString();
      const convo = { id, title: title || 'New Chat', messages: [] };
      conversations.unshift(convo);
      renderConvoList();
      return convo;
    }

    function setActiveConvo(id) {
      activeConvoId = id;
      renderConvoList();
      renderMessages();
    }

    function getActiveConvo() {
      return conversations.find(c => c.id === activeConvoId) || null;
    }

    function renderConvoList() {
      convoList.innerHTML = '';
      conversations.forEach(c => {
        const el = document.createElement('div');
        el.className = 'convo-item' + (c.id === activeConvoId ? ' active' : '');
        el.innerHTML = `<i class="bi bi-chat-left-text"></i><span>${escapeHtml(c.title)}</span>`;
        el.addEventListener('click', () => setActiveConvo(c.id));
        convoList.appendChild(el);
      });
    }

    // ── Message rendering ──────────────────────────────
    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderMessages() {
      const convo = getActiveConvo();
      messageList.innerHTML = '';

      if (!convo || convo.messages.length === 0) {
        messageList.appendChild(emptyState);
        return;
      }

      convo.messages.forEach(msg => appendMessageBubble(msg.role, msg.content, false));
      messageList.scrollTop = messageList.scrollHeight;
    }

    function appendMessageBubble(role, content, scroll = true) {
      emptyState.remove();

      const row = document.createElement('div');
      row.className = `msg-row ${role}`;

      const avatarIcon = role === 'user' ? '<i class="bi bi-person-fill"></i>' : '<i class="bi bi-stars"></i>';
      row.innerHTML = `
        <div class="msg-avatar">${avatarIcon}</div>
        <div class="msg-bubble">${escapeHtml(content)}</div>
      `;
      messageList.appendChild(row);

      if (scroll) {
        messageList.scrollTop = messageList.scrollHeight;
      }
    }

    function showTypingIndicator() {
      const row = document.createElement('div');
      row.className = 'msg-row assistant';
      row.id = 'typing-row';
      row.innerHTML = `
        <div class="msg-avatar"><i class="bi bi-stars"></i></div>
        <div class="msg-bubble typing-indicator">
          <span></span><span></span><span></span>
        </div>
      `;
      messageList.appendChild(row);
      messageList.scrollTop = messageList.scrollHeight;
    }

    function removeTypingIndicator() {
      document.getElementById('typing-row')?.remove();
    }

    // ── Send message ───────────────────────────────────
    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      // Ensure an active conversation exists
      if (!activeConvoId) {
        const convo = createConversation(text.slice(0, 40));
        setActiveConvo(convo.id);
      }

      const convo = getActiveConvo();
      convo.messages.push({ role: 'user', content: text });

      // Update sidebar title on first message
      if (convo.messages.length === 1) {
        convo.title = text.slice(0, 40);
        renderConvoList();
      }

      chatInput.value = '';
      chatInput.style.height = 'auto';
      appendMessageBubble('user', text);
      showTypingIndicator();
      sendBtn.disabled = true;

      try {
        // Attempt to get a token for the API call
        let headers = { 'Content-Type': 'application/json' };
        try {
          const token = await getAccessToken();
          if (token) headers['Authorization'] = `Bearer ${token}`;
        } catch (_) {
          // Not authenticated — proceed without token
        }

        // TODO: Replace the placeholder below with a real fetch() call to your agent API.
        // Example: POST to an Express route you add to server.js (e.g. /api/chat),
        // passing { messages: convo.messages } in the body and the Bearer token in the header.
        await new Promise(r => setTimeout(r, 1000));
        const reply = 'This is a placeholder response. Connect your AI agent API to /api/chat to get real answers.';

        removeTypingIndicator();
        convo.messages.push({ role: 'assistant', content: reply });
        appendMessageBubble('assistant', reply);
      } catch (err) {
        removeTypingIndicator();
        const errMsg = 'Sorry, something went wrong. Please try again.';
        convo.messages.push({ role: 'assistant', content: errMsg });
        appendMessageBubble('assistant', errMsg);
        console.error('Agent error:', err);
      } finally {
        sendBtn.disabled = false;
        chatInput.focus();
      }
    }

    // ── Input bar events ───────────────────────────────
    sendBtn.addEventListener('click', sendMessage);

    chatInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Auto-grow textarea
    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 140) + 'px';
    });

    clearBtn.addEventListener('click', () => {
      const convo = getActiveConvo();
      if (convo) {
        convo.messages = [];
        renderMessages();
      }
    });

    newChatBtn.addEventListener('click', () => {
      const convo = createConversation('New Chat');
      setActiveConvo(convo.id);
    });

    // ── Init ───────────────────────────────────────────
    (async () => {
      try {
        await initAuth();
        const account = getActiveAccount();
        if (account) showUserUI(account);
      } catch (err) {
        console.warn('Auth init failed:', err);
      }
    })();
  </script>
</body>
</html>
